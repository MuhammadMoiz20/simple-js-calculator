<!DOCTYPE html>
<html>
<head>
  <title>calc</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🧮</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calc">
    <div id="display">0</div>
    <div class="keys">
      <button class="util">C</button><button class="util">CE</button><button class="util">←</button><button>/</button>
      <button>7</button><button>8</button><button>9</button><button>*</button>
      <button>4</button><button>5</button><button>6</button><button>-</button>
      <button>1</button><button>2</button><button>3</button><button>+</button>
      <button>0</button><button>.</button><button>=</button>
    </div>
    <h3>history</h3>
    <ul id="history"></ul>
  </div>
  <script src="app.js"></script>
</body>
</html>
